trigger:
- master

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'f70a1f92-7c6b-4816-ba51-69fc4f18264b'
  imageRepository: 'adjuneazuredevopsgithubacraksapp'
  containerRegistry: 'aksdevopsacradds.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and Push Stage
  jobs:
  - job: Build
    displayName: Build Job
    pool:
      vmImage: $(vmImageName)

    steps:

    # Step 1: Build and Push Docker Image to ACR
    - task: Docker@2
      displayName: Build and Push Image to ACR
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    # Step 2: Debug - List files in working directory
    - bash: |
        echo "Contents in System Default Working Directory"
        ls -R $(System.DefaultWorkingDirectory)

    # Step 3: Debug - Before copying
    - bash: |
        echo "Before copying Contents in Artifact Directory"
        ls -R $(Build.ArtifactStagingDirectory)

    # Step 4: Copy Kubernetes manifests
    - task: CopyFiles@2
      displayName: Copy Kube Manifests
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)/kube-manifests'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        OverWrite: true

    # Step 5: Debug - After copying
    - bash: |
        echo "After copying to Build Artifact Directory"
        ls -R $(Build.ArtifactStagingDirectory)

    # Step 6: Publish Build Artifacts
    - task: PublishBuildArtifacts@1
      displayName: Publish Artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'kube-manifests'
        publishLocation: 'Container'